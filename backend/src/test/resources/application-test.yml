  secret_key: bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZ1B1cnBvc2VzMTIzNDU2Nzg5MA==
  access_token_expiration: 1h
  refresh_token_expiration: 1d

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:database
    username: sa
    password:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
  flyway:
    enabled: false
