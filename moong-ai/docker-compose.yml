version: '3.8'

services:
  disease-prediction-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet-disease-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 메모리 제한
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M