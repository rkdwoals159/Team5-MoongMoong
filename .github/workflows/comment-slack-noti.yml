name: Slack Notification from GitHub Comments

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [ created ]

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: github.event.comment != null

    steps:
      - name: Check and send to Slack
        run: |
          COMMENT="${{ github.event.comment.body }}"
          
          if [[ "$COMMENT" == /noti-be* ]]; then
            WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL_BE }}"
          elif [[ "$COMMENT" == /noti-fe* ]]; then
            WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL_FE }}"
          else
            echo "Not a notification comment"
            exit 0
          fi
          
          # GitHub 멘션을 Slack 멘션으로 변환
          declare -A USER_MAP=(
            ["joyjhm"]="${{ secrets.HYUNMIN_SLACK_ID }}"
            ["coli-geonwoo"]="${{ secrets.GEONWOO_SLACK_ID }}"
            ["yeonjinJoo"]="${{ secrets.YEONJIN_SLACK_ID }}"
            ["bonsng"]="${{ secrets.BONSNG_SLACK_ID }}"
            ["rkdwoals159"]="${{ secrets.JAEMIN_SLACK_ID }}"
            ["yyoonngg"]="${{ secrets.YOUNGHYUN_SLACK_ID }}"
          )
          
          MAPPED_COMMENT="$COMMENT"
          for github_user in "${!USER_MAP[@]}"; do
            slack_id="${USER_MAP[$github_user]}"
            MAPPED_COMMENT="${MAPPED_COMMENT//@$github_user/<@$slack_id>}"
          done
          
          # /noti-be 또는 /noti-fe 제거
          MAPPED_COMMENT="${MAPPED_COMMENT#/noti-be}"
          MAPPED_COMMENT="${MAPPED_COMMENT#/noti-fe}"
          MAPPED_COMMENT="${MAPPED_COMMENT## }"
          
          # PR URL 가져오기
          if [[ "${{ github.event.issue }}" != "" ]]; then
            PR_URL="${{ github.event.issue.html_url }}"
          else
            PR_URL="${{ github.event.pull_request.html_url }}"
          fi
          
          # Slack으로 전송
          curl -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"${MAPPED_COMMENT}\n\n<${PR_URL}|View PR>\"
            }"
