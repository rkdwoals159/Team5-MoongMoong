name: Frontend Preview

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.2.1

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build
        working-directory: frontend
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy to Preview
        id: deploy
        working-directory: frontend
        run: |
          URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview-comment -->';
            const body = `${marker}\n🔗 **Preview Deployed**\n\n${{ steps.deploy.outputs.deploy_url }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Summary
        run: |
          echo "### Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
